name: CI

# Pull requests and direct pushes to main both run this. Most work on this
# repo lands straight on main, so a pull-request-only trigger would leave
# nearly every commit unchecked.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Formatting before the slower checks: it is the cheapest failure and
      # the one most likely to appear in an outside pull request. site/ is
      # excluded in .prettierignore, so this never collides with the
      # generated-page check below.
      - run: npm run format:check

      - run: npm run compile
      - run: npm run build
      - run: npm run build:firefox

      # The per-platform pages under site/public are generated from
      # site/pages, so editing one of them directly is silently undone by the
      # next build. Regenerating and diffing turns that into a failure here
      # instead of a surprise weeks later.
      - name: Generated pages match their source
        run: |
          npm run build:pages
          if ! git diff --exit-code --stat -- site/public; then
            echo "::error::site/public is out of date. Edit site/pages and run 'npm run build:pages', do not edit the generated pages."
            exit 1
          fi

      - run: npm run build:site
