version: 2

# Everything here is dev tooling: package.json has no runtime dependencies, so
# nothing Dependabot bumps ever reaches the shipped extension. Grouped into one
# weekly PR because a one-person project does not need eight of them.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
    # No major bumps. The only npm dependency that is not build tooling is
    # the typechecker, and chasing its majors is churn: nothing here is in
    # the shipped path, so a bump buys nothing and costs a review. The
    # `version-update:` prefix scopes this to routine updates only, so a
    # security advisory still opens a PR at any version jump it needs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
