<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Not for You</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>
        <a href="https://notforyou.app" target="_blank" rel="noreferrer"
          >Not for You</a
        >
      </h1>
      <p>Remove the algorithm from social media.</p>
    </header>
    <ul id="platform-list"></ul>
    <footer>
      <!-- Two states, swapped by main.ts via the hidden attribute: a row of
           preset durations while enabled, and a countdown with a re-enable
           button while disabled. The preset buttons are built by main.ts
           from DISABLE_PRESETS. -->
      <div id="disable" role="group" aria-label="Disable temporarily">
        <div class="disable-heading">Disable for</div>
        <div id="disable-presets"></div>
        <div id="disable-active" hidden>
          <span id="disable-label"></span>
          <button id="enable" type="button">Re-enable</button>
        </div>
      </div>
      <!-- The rating link points at the Chrome Web Store here and main.ts
           swaps it for the Firefox listing in Firefox builds. -->
      <div id="links">
        <a
          href="https://github.com/preziotte/not-for-you/issues/new"
          target="_blank"
          rel="noreferrer"
        >
          Report a bug
        </a>
        <a
          id="rate"
          href="https://chromewebstore.google.com/detail/not-for-you/pakdneaipkfgaahgbafblmdebfoadjca/reviews"
          target="_blank"
          rel="noreferrer"
        >
          Leave a rating
        </a>
      </div>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
